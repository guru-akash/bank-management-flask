<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{{url_for('static',filename='css/fund_transaction.css')}}">
</head>
<body>
    {% include '/layouts/menu.html' %}
    <form action="/download_excel" method="GET"><br><br>
        <label for="">Download Excel : </label><br><br>
        <button type="submit">Download</button>
    </form><br><br>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="error-message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <form action="/upload_file" method="POST" enctype="multipart/form-data">
    <label for="file">Upload CSV / Excel:</label><br><br>
    <input
        type="file"
        id="file"
        name="file"
        accept=".csv, .xlsx, .xls"
        required
    ><br><br>
    <button type="submit">Upload</button>
</form><br><br>
    
</body>
</html>
